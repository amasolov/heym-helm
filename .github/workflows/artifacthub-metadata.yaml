name: Artifact Hub metadata
# Artifact Hub reads repository metadata (the Verified Publisher repositoryID)
# from an OCI artifact tagged artifacthub.io next to the chart.
on:
  push:
    branches: [main]
    paths: [artifacthub-repo.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oras-project/setup-oras@v1
      - name: Push artifacthub-repo.yml
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "ghcr.io/${{ github.repository_owner }}/charts/heym:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
