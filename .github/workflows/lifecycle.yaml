name: Lifecycle
on:
  pull_request:
    paths: [charts/heym/**, scripts/test-lifecycle.py, tests/**, .github/workflows/lifecycle.yaml]
  push:
    branches: [main]
    paths: [charts/heym/**, scripts/test-lifecycle.py, tests/**, .github/workflows/lifecycle.yaml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kind-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Create disposable Kubernetes 1.35 cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: heym-chart-ci
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          kubectl_version: v1.35.8
          wait: 120s
      - name: Install, upgrade and recover keys and persisted data
        run: python3 scripts/test-lifecycle.py --context kind-heym-chart-ci --namespace heym-chart-e2e --execute
      - name: Remove disposable cluster
        if: always()
        run: kind delete cluster --name heym-chart-ci
