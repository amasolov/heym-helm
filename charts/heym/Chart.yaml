apiVersion: v2
name: heym
description: >-
  Community Helm chart for Heym, the AI workflow platform. Runs every sandbox
  (Python tools, skills, Code node, MCP stdio, Playwright, Codex, OpenCode) as
  its own restricted pod, with no Docker socket.
type: application
version: 0.5.0
# Heym's release tag. The image is ghcr.io/heymrun/heym:<appVersion>.
appVersion: "0.0.149"
# The Kubernetes sandbox backend needs 1.30+ (heymrun/heym#848).
kubeVersion: ">=1.30.0-0"
home: https://github.com/amasolov/heym-helm
icon: https://raw.githubusercontent.com/heymrun/heym/main/frontend/public/fav.svg
sources:
  - https://github.com/amasolov/heym-helm
  - https://github.com/heymrun/heym
keywords:
  - heym
  - ai
  - workflow
  - agents
  - llm
  - sandbox
maintainers:
  - name: amasolov
    url: https://github.com/amasolov
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/prerelease: "true"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/links: |
    - name: Heym
      url: https://heym.run
    - name: Kubernetes sandbox backend (upstream)
      url: https://github.com/heymrun/heym/pull/848
  artifacthub.io/images: |
    - name: heym
      image: ghcr.io/heymrun/heym:latest
  artifacthub.io/changes: |
    - kind: added
      description: Credentials from Kubernetes Secrets (kubernetesCredentials.enabled), with a Secrets Role for the backend and workers (Heym 0.0.149)
    - kind: added
      description: Workers run Heym's ENCRYPTION_KEY check before starting, as the image entrypoint does on main (Heym 0.0.149)
    - kind: added
      description: Optional per-key references, for ENCRYPTION_KEYS_EXTRA during an ENCRYPTION_KEY rotation
    - kind: changed
      description: appVersion 0.0.149; scaling workers down no longer needs a weight-0 drain (Heym 0.0.145 retargets queued runs)
