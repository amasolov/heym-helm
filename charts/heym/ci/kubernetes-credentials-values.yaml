# Credentials from labelled Secrets, with a worker and Cilium, plus an optional
# ENCRYPTION_KEYS_EXTRA reference as during an ENCRYPTION_KEY rotation.
cni: cilium
url: https://heym.example.com
secrets:
  existingSecret: heym-secrets
  keyRefs:
    ENCRYPTION_KEYS_EXTRA: {name: heym-previous-key, key: ENCRYPTION_KEY, optional: true}
kubernetesCredentials:
  enabled: true
cluster:
  enabled: true
  replicas: 1
networkPolicy:
  enabled: true
