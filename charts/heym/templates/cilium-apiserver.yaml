{{- if and .Values.sandbox.enabled (include "heym.ciliumApiServerPolicy" .) }}
# The backend to the API server, to start sandbox pods. With kube-proxy
# replacement Cilium rewrites the kubernetes Service to a node's :6443 before
# policy is evaluated, and gives it the reserved kube-apiserver identity, which
# an ipBlock rule does not match. Cilium ORs this with the backend's
# NetworkPolicy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "heym.fullname" . }}-kube-apiserver
  labels:
    {{- include "heym.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "heym.selectorLabels" . | nindent 6 }}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
{{- if .Values.cluster.enabled }}
---
# Workers start sandbox pods too. A policy of its own rather than one selector
# for both, because the backend's selector may be adopted (selectorLabels).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "heym.workerName" . }}-kube-apiserver
  labels:
    {{- include "heym.workerLabels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "heym.workerSelectorLabels" . | nindent 6 }}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
{{- end }}
{{- end }}
