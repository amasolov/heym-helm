{{- if .Values.kubernetesCredentials.enabled }}
# Credentials from Secrets labelled heym.run/credential: "true". Every process,
# on the backend and on each worker, lists and watches them itself, because
# values stay in memory and never reach the database. Secrets RBAC can't be
# narrowed by label, so this reads every Secret in the watched namespace; Heym
# refuses to start if list or watch is denied.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "heym.fullname" . }}-credentials
  namespace: {{ include "heym.credentialsNamespace" . }}
  labels:
    {{- include "heym.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "heym.fullname" . }}-credentials
  namespace: {{ include "heym.credentialsNamespace" . }}
  labels:
    {{- include "heym.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "heym.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "heym.fullname" . }}-credentials
{{- end }}
