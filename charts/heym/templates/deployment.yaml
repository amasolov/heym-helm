{{- include "heym.validPlatform" . -}}
{{- include "heym.validateSecrets" . -}}
{{- include "heym.validateConfiguration" . -}}
{{- include "heym.validateCluster" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heym.fullname" . }}
  labels:
    {{- include "heym.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # One replica: the data volume is usually ReadWriteOnce, and Heym's own
  # scale-out is separate worker Deployments, not replicas of this one.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "heym.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "heym.podLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "heym.serviceAccountName" . }}
      # The token starts sandbox pods (role.yaml). Sandbox pods get none.
      automountServiceAccountToken: {{ .Values.sandbox.enabled }}
      # Service links would inject POSTGRES_PORT=tcp://... for any Service
      # named postgres in the namespace, colliding with Heym's own setting.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "heym.podSecurityContext" . | nindent 8 }}
      # Exactly one container: Heym finds the sandbox image by reading its own
      # pod (by hostname, which must stay the pod name) and takes the image
      # only when the pod has a single container.
      containers:
        - name: heym
          image: {{ include "heym.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.workingDir }}
          workingDir: {{ . | quote }}
          {{- end }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: 4017
              protocol: TCP
            {{- with .Values.extraPorts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "heym.environment" (dict "root" . "role" "main") | nindent 12 }}
          {{- with include "heym.envFrom" . | trim }}
          envFrom:
            {{- . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # /api/health is answered by the backend through the frontend's
          # proxy, so one probe covers both processes. Migrations run before
          # either starts.
          startupProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.service.portName }}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.service.portName }}
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.service.portName }}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            # vite preview bundles its config here at every start.
            - name: vite-temp
              mountPath: /app/frontend/node_modules/.vite-temp
            - name: shm
              mountPath: /dev/shm
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "heym.claimName" . }}
        - name: tmp
          emptyDir: {}
        - name: vite-temp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSize }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
