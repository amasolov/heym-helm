{{- if .Values.networkPolicy.enabled }}
# The backend. Site-specific destinations (database, LLM gateway, identity
# provider) go in networkPolicy.extraEgress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heym.fullname" . }}
  labels:
    {{- include "heym.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heym.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 4017
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    {{- include "heym.dnsEgress" . | nindent 4 }}
    {{- if .Values.networkPolicy.allowInternet }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- include "heym.exceptCIDRs" . | nindent 14 }}
    {{- end }}
    {{- if and .Values.sandbox.enabled .Values.networkPolicy.apiServerCIDRs }}
    # The API server, to start sandbox pods. Its endpoints are node or
    # control-plane addresses, usually inside the private ranges above.
    - to:
        {{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
