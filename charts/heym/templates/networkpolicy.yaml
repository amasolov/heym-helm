{{- if .Values.networkPolicy.enabled }}
# The backend. Site-specific destinations (database, LLM gateway, identity
# provider) go in networkPolicy.extraEgress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heym.fullname" . }}
  labels:
    {{- include "heym.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heym.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 4017
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    {{- include "heym.backendEgress" . | nindent 4 }}
{{- if .Values.cluster.enabled }}
---
# Workers. The same egress as the backend, because leader duties (scheduler,
# alerts, IMAP/RabbitMQ/WebSocket/Google listeners) can run on any instance.
# No ingress: workers take work from the database queue. Kubelet probes come
# from the node, which common CNIs (Cilium, OVN-Kubernetes, Calico) allow
# regardless of policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heym.workerName" . }}
  labels:
    {{- include "heym.workerLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heym.workerSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    {{- include "heym.backendEgress" . | nindent 4 }}
{{- end }}
{{- end }}
