{{- if include "heym.routeEnabled" . }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "heym.fullname" . }}
  labels:
    {{- include "heym.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "heym.fullname" . }}
  port:
    targetPort: {{ .Values.service.portName }}
  tls:
    {{- toYaml .Values.route.tls | nindent 4 }}
{{- end }}
