{{- if include "heym.inlineSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "heym.secretName" . }}
  labels:
    {{- include "heym.labels" . | nindent 4 }}
  annotations:
    # Application keys must survive release removal or a switch to external refs.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
stringData:
  {{- if .Values.secrets.secretKey }}
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
{{- end }}
